<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes Universitarios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            color: #1e293b;
        }

        header {
            background: #123b64;
            color: white;
            padding: 25px;
            text-align: center;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .tarjeta {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #00000015;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            margin-top: 20px;
            padding: 12px 18px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0f4c81;
        }

        #mensaje {
            margin-top: 15px;
            color: #166534;
        }
    </style>
</head>
<body>

    <header>
        <h1>Reportes Universitarios</h1>
        <p>Sistema de reportes de problemas universitarios</p>
    </header>

    <main>
        <section class="tarjeta">
            <h2>Registrar un problema</h2>
            <p>Completa los siguientes datos para registrar un reporte.</p>

            <form action="/registrar" method="post"
                <label for="estudiante">Nombre del estudiante</label>
                <input type="text" id="estudiante" name="estudiante" required>

                <label for="categoria">Tipo de problema</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecciona una opción</option>
                    <option>Infraestructura</option>
                    <option>Equipos</option>
                    <option>Internet</option>
                    <option>Otros servicios</option>
                </select>

                <label for="descripcion">Descripción del problema</label>
                <textarea id="descripcion" name="descripcion" rows="4" required></textarea>

                <button type="submit">Registrar reporte</button>
            </form>

            <p id="mensaje"></p>
        </section>
    </main>

    <script>
        document.getElementById("formulario").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("mensaje").textContent =
                "Formulario completado correctamente. Falta conectar el sistema con Python.";

            this.reset();
        });
    </script>

</body>
    </html>
